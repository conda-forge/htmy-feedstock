schema_version: 1

context:
  version: "0.13.6"

package:
  name: htmy
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/h/htmy/htmy-${{ version }}.tar.gz
    sha256: a01900dda8b2fee7d1acc565e33c522fcf22b5b312c42e3cc2919b19d34c67bd

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - anyio >=4.7.0,<5
    - markdown >=3.8,<4

tests:
  - python:
      imports:
        - htmy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/volfpeter/htmy
  summary: Async, pure-Python server-side rendering engine.

extra:
  recipe-maintainers:
    - davidbrochart
